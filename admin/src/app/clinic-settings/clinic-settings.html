<section class="settings">
  <header>
    <div class="crumbs">
      <a [href]="websiteUrl">HABILISALUD</a>
      <span>/</span>
      <a href="/consultorio.html">Consultorio</a>
      <h1>Configuración</h1>
    </div>
    <app-clinic-switcher (switched)="onClinicSwitched()" />
  </header>

  @if (canWriteClinical()) {
    <app-assistants-card [isAdmin]="isClinicAdmin()" />
    @if (isAesthetic()) {
      <app-services-card [isAdmin]="isClinicAdmin()" [aesthetic]="true" />
    }
  }
</section>
